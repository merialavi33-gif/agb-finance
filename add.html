<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yab Financial - Add Transaction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9 !important; color: #1e293b !important; min-height: 100vh; padding-bottom: 75px; animation: fadeIn 0.2s ease-in-out; }
        .glass-header { background: rgba(241, 245, 249, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .type-btn { flex: 1; padding: 12px; text-align: center; background: #e2e8f0; border-radius: 0.75rem; cursor: pointer; font-weight: bold; font-size: 13px; color: #64748b; transition: all 0.2s; border: none; }
        .type-btn.active-income { background: #10b981 !important; color: #fff !important; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .type-btn.active-expense { background: #ef4444 !important; color: #fff !important; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        .type-btn.active-savings { background: #3b82f6 !important; color: #fff !important; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        .form-input { width: 100%; padding: 12px; background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b; border-radius: 0.75rem; margin-bottom: 15px; outline: none; font-size: 14px; }
        .form-input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
        .submit-btn { width: 100%; padding: 14px; background: #10b981; color: white; border: none; border-radius: 0.75rem; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .submit-btn:hover { background: #059669; }
        .navbar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid rgba(226, 232, 240, 0.8); z-index: 1000; max-width: 42rem; margin: 0 auto; }
        .nav-item { text-align: center; color: #64748b; font-size: 11px; font-weight: 600; cursor: pointer; background: none; border: none; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .nav-item.active { color: #10b981; }
        .nav-item div { font-size: 18px; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="glass-header border-b border-slate-200 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div></div>
            <h1 class="text-base font-extrabold text-slate-800 tracking-wide" data-en="Yab Financial" data-am="Yab Financial">Yab Financial</h1>
            <!-- የቋንቋ መቀየሪያ በተን -->
            <button onclick="toggleLanguage()" id="langBtn" class="px-3 py-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-lg transition">EN</button>
        </div>
    </header>

    <main id="main-content" class="max-w-2xl mx-auto p-4 space-y-4">
        <h3 class="text-sm font-bold text-slate-700 mb-1" data-en="➕ Add Transaction" data-am="➕ መረጃ መዝግብ">➕ መረጃ መዝግብ</h3>
        
        <!-- የግብይት ዓይነት መምረጫ በተኖች -->
        <div class="flex gap-2 mb-3">
            <button type="button" class="type-btn active-income" id="type-income" onclick="setType('income')" data-en="Income" data-am="ገቢ">ገቢ</button>
            <button type="button" class="type-btn" id="type-expense" onclick="setType('expense')" data-en="Expense" data-am="ወጪ">ወጪ</button>
            <button type="button" class="type-btn" id="type-savings" onclick="saveTypeSelection('savings')" data-en="Savings" data-am="ቁጠባ">ቁጠባ</button>
        </div>

        <form id="transactionForm" onsubmit="handleSubmit(event)">
            <label class="block text-xs font-bold text-slate-600 mb-1" data-en="Date" data-am="ቀን">ቀን</label>
            <input type="date" id="dateInput" class="form-input" required>

            <label class="block text-xs font-bold text-slate-600 mb-1" data-en="Amount (ETB)" data-am="መጠን (ብር)">መጠን (ብር)</label>
            <input type="number" id="amountInput" class="form-input" placeholder="0.00" required>

            <label class="block text-xs font-bold text-slate-600 mb-1" data-en="Category" data-am="ምድብ">ምድብ</label>
            <input type="text" id="categoryInput" class="form-input" placeholder="e.g., Food, Salary..." required>

            <label class="block text-xs font-bold text-slate-600 mb-1" data-en="Description (Optional)" data-am="ማስታወሻ (አማራጭ)">ማስታወሻ (አማራጭ)</label>
            <input type="text" id="descInput" class="form-input" placeholder="Note...">

            <button type="submit" class="submit-btn" data-en="Save Transaction" data-am="መዝግብ">መዝግብ</button>
        </form>
    </main>

    <!-- የታችኛው ፉተር (Navbar) -->
    <nav class="navbar">
        <a onclick="navigatePage('home.html')" class="nav-item"><div><i class="fa-solid fa-house"></i></div>home</a>
        <a onclick="navigatePage('add.html')" class="nav-item active"><div><i class="fa-solid fa-file-arrow-up"></i></div>add</a>
        <a onclick="navigatePage('list.html')" class="nav-item"><div><i class="fa-solid fa-file-lines"></i></div>list</a>
        <a onclick="navigatePage('goals.html')" class="nav-item"><div><i class="fa-solid fa-briefcase"></i></div>goals</a>
        <a onclick="navigatePage('reports.html')" class="nav-item"><div><i class="fa-solid fa-chart-pie"></i></div>reports</a>
        <a onclick="navigatePage('settings.html')" class="nav-item"><div><i class="fa-solid fa-gear"></i></div>settings</a>
    </nav>

<script>
    let currentLang = localStorage.getItem('app_lang') || 'EN';
    let currentType = 'income';

    function setType(type) {
        currentType = type;
        document.getElementById('type-income').className = 'type-btn';
        document.getElementById('type-expense').className = 'type-btn';
        document.getElementById('type-savings').className = 'type-btn';

        if(type === 'income') {
            document.getElementById('type-income').className = 'type-btn active-income';
        } else if(type === 'expense') {
            document.getElementById('type-expense').className = 'type-btn active-expense';
        } else if(type === 'savings') {
            document.getElementById('type-savings').className = 'type-btn active-savings';
        }
    }
    
    function saveTypeSelection(type) {
        setType(type);
    }

    function toggleLanguage() {
        currentLang = currentLang === 'EN' ? 'AM' : 'EN';
        localStorage.setItem('app_lang', currentLang);
        applyLanguage();
    }

    function applyLanguage() {
        document.querySelectorAll('[data-en]').forEach(el => {
            el.innerText = el.getAttribute(`data-${currentLang.toLowerCase()}`);
        });
        let langBtn = document.getElementById('langBtn');
        if(langBtn) langBtn.innerText = currentLang;
    }

    async function navigatePage(url) {
        try {
            let response = await fetch(url);
            let htmlText = await response.text();
            let parser = new DOMParser();
            let doc = parser.parseFromString(htmlText, 'text/html');
            
            document.querySelector('main').innerHTML = doc.querySelector('main').innerHTML;
            document.title = doc.title;
            history.pushState({}, '', url);
            applyLanguage();
        } catch (e) {
            location.href = url;
        }
    }

    function handleSubmit(e) {
        e.preventDefault();
        let date = document.getElementById('dateInput').value;
        let amount = parseFloat(document.getElementById('amountInput').value);
        let category = document.getElementById('categoryInput').value;
        let desc = document.getElementById('descInput').value;

        let transactions = JSON.parse(localStorage.getItem('my_finance_data')) || [];
        let newTransaction = {
            id: Date.now(),
            type: currentType,
            date: date,
            amount: amount,
            category: category,
            desc: desc
        };

        transactions.push(newTransaction);
        localStorage.setItem('my_finance_data', JSON.stringify(transactions));
        alert(currentLang === 'EN' ? 'Transaction saved successfully!' : 'መረጃው በተሳካ ሁኔታ ተመዝግቧል!');
        window.location.href = 'list.html';
    }

    // ዛሬን በራስ ሰር በdate input ላይ መሙላት
    document.getElementById('dateInput').valueAsDate = new Date();
    applyLanguage();
</script>
</body>
</html>
