  <!-- AGB.F ጽሁፍ -->
  <text x="50%" y="54%" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="125" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="4">AGB.F</text>
